[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "converge-flights"
version = "0.1.0"
description = "Find and compare group flights from different origins to a shared destination."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "converge-flights contributors" }]
keywords = ["flights", "amadeus", "kiwi", "tequila", "travel", "cli"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
]

dependencies = [
    "httpx==0.27.2",
    "pydantic==2.9.2",
    "typer==0.12.5",
    # typer 0.12.x targets Click 8.1.x; Click >=8.2 changed make_metavar()
    # and breaks typer's rich help rendering, so pin the compatible range.
    "click>=8.1,<8.2",
    "rich==13.9.2",
    "openpyxl==3.1.5",
    "PyYAML==6.0.2",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "mypy==1.11.2",
    "ruff==0.6.9",
    "types-PyYAML==6.0.12.20240917",
]

[project.scripts]
converge-flights = "converge_flights.cli:main"

[project.urls]
Homepage = "https://github.com/Nigam-Codes/FlightPriceTracker4More"
Repository = "https://github.com/Nigam-Codes/FlightPriceTracker4More"

[tool.hatch.build.targets.wheel]
packages = ["converge_flights"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
